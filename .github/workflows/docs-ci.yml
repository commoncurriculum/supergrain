name: Docs CI

on:
  pull_request:
    paths:
      - "packages/docs/**"
      # The package pages are generated from the package READMEs.
      - "packages/*/README.md"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs-ci.yml"

jobs:
  build:
    name: Docs / typecheck + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @supergrain/docs run typecheck

      - name: Build
        run: pnpm --filter @supergrain/docs run build
